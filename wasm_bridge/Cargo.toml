[package]
name = "wasm_bridge"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "C-ABI JSON bridge for Geogram WASM module runtime — mirrors signal_bridge interface"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasmer = { version = "5", default-features = false, features = ["sys", "singlepass", "wat"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 2
lto = false
strip = false
