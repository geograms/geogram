org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -XX:ActiveProcessorCount=4 -Dfile.encoding=UTF-8
android.useAndroidX=true

# Build optimization - incremental builds
org.gradle.caching=true
# Disable parallel to reduce memory pressure
org.gradle.parallel=false
org.gradle.configureondemand=true
kotlin.incremental=true

# Hard cap on Gradle worker threads. Without this Gradle scales workers with
# Runtime.availableProcessors(), which makes the whole machine unresponsive on
# boxes with many cores. 4 is plenty for this project; raise at your own risk.
org.gradle.workers.max=4

# Cap the Kotlin compiler daemon JVM. The Kotlin daemon is a SEPARATE process
# from the Gradle daemon — without a cap it uses its own JVM heap default,
# which on a 16 GB box happily grows past 4 GB on top of the Gradle daemon's
# 2 GB. 1.5 GB is enough for this codebase.
kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m

# Reuse a single daemon instead of spawning new ones
org.gradle.daemon=true
# Idle timeout: keep daemon alive 30 min (default is 3 hours)
org.gradle.daemon.idletimeout=1800000
