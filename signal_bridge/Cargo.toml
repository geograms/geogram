[package]
name = "signal_bridge"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "C-ABI JSON bridge for presage (Signal) — mirrors TDLib's JSON client interface"

[lib]
crate-type = ["cdylib"]

[dependencies]
presage = { git = "https://github.com/whisperfish/presage", rev = "b575f2e83932e9d8bb29d281bc2ae2c93d9758f4" }
presage-store-sqlite = { git = "https://github.com/whisperfish/presage", rev = "b575f2e83932e9d8bb29d281bc2ae2c93d9758f4" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
futures = "0.3"
libc = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
url = "2"

[patch.crates-io]
curve25519-dalek = { git = "https://github.com/signalapp/curve25519-dalek", tag = "signal-curve25519-4.1.3" }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
