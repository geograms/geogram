<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geogram Conference</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#1a1a2e;color:#e0e0e0;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:16px}
h1{font-size:1.4em;margin-bottom:8px;color:#f0f0f0}
#status{font-size:.9em;color:#888;margin-bottom:16px}
#join-form{display:flex;flex-direction:column;gap:12px;align-items:center;margin:24px 0}
#join-form input{padding:10px 16px;border-radius:8px;border:1px solid #444;background:#2a2a40;color:#fff;font-size:1em;width:240px;text-align:center}
button{padding:10px 24px;border:none;border-radius:8px;font-size:1em;cursor:pointer;transition:background .2s}
#btn-join-listener{background:#4a9eff;color:#fff}
#btn-join-listener:hover{background:#3a8eef}
#btn-join-speaker{background:#2ecc71;color:#fff}
#btn-join-speaker:hover{background:#27ae60}
button:disabled{background:#555;cursor:default}
#call-ui{display:none;flex-direction:column;align-items:center;gap:16px;width:100%;max-width:400px}
#participants{width:100%;list-style:none}
#participants li{padding:10px 16px;background:#2a2a40;border-radius:8px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
#participants li .name{font-weight:600}
#participants li .role{font-size:.75em;color:#888;margin-left:8px}
#participants li .state{font-size:.8em;color:#888}
.controls{display:flex;gap:12px;margin-top:8px}
#btn-mute{background:#444;color:#fff}
#btn-mute.muted{background:#e74c3c}
#btn-leave{background:#e74c3c;color:#fff}
#btn-leave:hover{background:#c0392b}
.connected{color:#2ecc71}
.connecting{color:#f39c12}
.role-label{font-size:.8em;padding:2px 8px;border-radius:4px;margin-left:8px}
.role-speaker{background:#2ecc71;color:#fff}
.role-listener{background:#555;color:#ccc}
.info-bar{font-size:.85em;color:#aaa;margin-bottom:12px}
</style>
</head>
<body>
<h1>Geogram Conference</h1>
<div id="status">Not connected</div>

<div id="join-form">
  <input id="nickname" type="text" placeholder="Your name" maxlength="20" autofocus>
  <button id="btn-join-listener" onclick="joinConference('listener')">Join as Listener</button>
  <button id="btn-join-speaker" onclick="joinConference('speaker')">Join as Speaker</button>
  <div style="font-size:.8em;color:#666;margin-top:4px">Listeners don't need a microphone</div>
</div>

<div id="call-ui">
  <div id="info-bar" class="info-bar"></div>
  <ul id="participants"></ul>
  <div class="controls">
    <button id="btn-mute" onclick="toggleMute()" style="display:none">Mute</button>
    <button id="btn-leave" onclick="leaveConference()">Leave</button>
  </div>
</div>

<script>
'use strict';

const loc = window.location;
const wsUrl = (loc.protocol === 'https:' ? 'wss://' : 'ws://') + loc.host + '/meet/ws';

let ws = null;
let localStream = null;
let myCallsign = '';
let myRole = 'listener';
let muted = false;
let hostCallsign = '';
let hostPc = null; // Single connection to host
const audioElements = {}; // stream.id -> HTMLAudioElement
const knownParticipants = {}; // callsign -> { role }

const statusEl = document.getElementById('status');
const joinForm = document.getElementById('join-form');
const callUi = document.getElementById('call-ui');
const participantsEl = document.getElementById('participants');
const muteBtn = document.getElementById('btn-mute');
const infoBar = document.getElementById('info-bar');

function setStatus(msg) { statusEl.textContent = msg; }

async function joinConference(role) {
  const nick = document.getElementById('nickname').value.trim();
  if (!nick) { alert('Enter your name'); return; }
  myCallsign = 'WEB-' + nick.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 12);
  myRole = role;

  document.getElementById('btn-join-listener').disabled = true;
  document.getElementById('btn-join-speaker').disabled = true;

  // Only request mic for speakers
  if (role === 'speaker') {
    setStatus('Requesting microphone...');
    try {
      localStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
        video: false
      });
    } catch (e) {
      setStatus('Microphone access denied');
      document.getElementById('btn-join-listener').disabled = false;
      document.getElementById('btn-join-speaker').disabled = false;
      return;
    }
    muteBtn.style.display = '';
  } else {
    setStatus('Connecting as listener...');
  }

  ws = new WebSocket(wsUrl);

  ws.onopen = () => {
    ws.send(JSON.stringify({ type: 'conference_hello', callsign: myCallsign, role: myRole }));
    setStatus('Connected — waiting for room info...');
  };

  ws.onmessage = (ev) => handleMessage(JSON.parse(ev.data));

  ws.onclose = () => {
    setStatus('Disconnected');
    cleanup();
  };

  ws.onerror = () => {
    setStatus('Connection failed');
    document.getElementById('btn-join-listener').disabled = false;
    document.getElementById('btn-join-speaker').disabled = false;
  };
}

function handleMessage(msg) {
  switch (msg.type) {
    case 'conference_welcome':
      joinForm.style.display = 'none';
      callUi.style.display = 'flex';
      hostCallsign = msg.host_callsign || '';
      setStatus('In conference: ' + (msg.room_name || ''));

      // Track participants
      if (msg.participants) {
        const speakers = msg.speakers || [];
        msg.participants.forEach(cs => {
          knownParticipants[cs] = { role: speakers.includes(cs) ? 'speaker' : 'listener' };
        });
      }

      // In star topology, connect only to host
      if (hostCallsign && hostCallsign !== myCallsign) {
        connectToHost();
      }
      updateUI();
      break;

    case 'conference_participant_joined':
      knownParticipants[msg.callsign] = { role: msg.role || 'listener' };
      updateUI();
      break;

    case 'conference_participant_left':
      delete knownParticipants[msg.callsign];
      updateUI();
      break;

    case 'conference_role_change':
      if (knownParticipants[msg.callsign]) {
        knownParticipants[msg.callsign].role = msg.role;
      }
      // If we got promoted/demoted
      if (msg.callsign === myCallsign) {
        handleMyRoleChange(msg.role);
      }
      updateUI();
      break;

    case 'conference_end':
      setStatus('Conference ended by host');
      cleanup();
      break;

    case 'conference_error':
      setStatus('Error: ' + msg.error);
      break;

    // WebRTC signals from host (renegotiation)
    case 'webrtc_offer':
      handleOfferFromHost(msg);
      break;

    case 'webrtc_answer':
      handleAnswer(msg);
      break;

    case 'webrtc_ice':
      handleIce(msg);
      break;

    case 'webrtc_bye':
      if (hostPc) { hostPc.close(); hostPc = null; }
      updateUI();
      break;
  }
}

// ── WebRTC — single connection to host ────────────────────────────

function createHostConnection() {
  const pc = new RTCPeerConnection({ iceServers: [] });

  // Add local audio only if speaker
  if (localStream && myRole === 'speaker') {
    localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
  }

  pc.onicecandidate = (ev) => {
    if (ev.candidate) {
      sendSignal({
        type: 'webrtc_ice',
        to_callsign: hostCallsign,
        candidate: {
          candidate: ev.candidate.candidate,
          sdpMid: ev.candidate.sdpMid,
          sdpMLineIndex: ev.candidate.sdpMLineIndex
        }
      });
    }
  };

  // Multiple remote tracks (one per speaker on the host)
  pc.ontrack = (ev) => {
    if (ev.streams && ev.streams[0]) {
      const stream = ev.streams[0];
      let audio = audioElements[stream.id];
      if (!audio) {
        audio = new Audio();
        audio.autoplay = true;
        audioElements[stream.id] = audio;
      }
      audio.srcObject = stream;
    }
  };

  pc.onconnectionstatechange = () => updateUI();

  hostPc = pc;
  return pc;
}

async function connectToHost() {
  const pc = createHostConnection();
  const offer = await pc.createOffer({ offerToReceiveAudio: true, offerToReceiveVideo: false });
  await pc.setLocalDescription(offer);

  sendSignal({
    type: 'webrtc_offer',
    to_callsign: hostCallsign,
    session_id: Date.now().toString(),
    role: myRole,
    sdp: { type: offer.type, sdp: offer.sdp }
  });
}

async function handleOfferFromHost(msg) {
  // Renegotiation from host (new speaker tracks added/removed)
  if (!hostPc) createHostConnection();
  const pc = hostPc;

  await pc.setRemoteDescription(new RTCSessionDescription({ type: msg.sdp.type, sdp: msg.sdp.sdp }));

  const answer = await pc.createAnswer({ offerToReceiveAudio: true, offerToReceiveVideo: false });
  await pc.setLocalDescription(answer);

  sendSignal({
    type: 'webrtc_answer',
    to_callsign: msg.from_callsign || hostCallsign,
    session_id: msg.session_id,
    sdp: { type: answer.type, sdp: answer.sdp }
  });
}

async function handleAnswer(msg) {
  if (!hostPc) return;
  await hostPc.setRemoteDescription(new RTCSessionDescription({ type: msg.sdp.type, sdp: msg.sdp.sdp }));
}

async function handleIce(msg) {
  if (!msg.candidate) return;
  if (hostPc && hostPc.remoteDescription) {
    await hostPc.addIceCandidate(new RTCIceCandidate(msg.candidate));
  }
  // If no remote description yet, candidate will be queued by browser
}

async function handleMyRoleChange(newRole) {
  myRole = newRole;
  if (newRole === 'speaker' && !localStream) {
    try {
      localStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
        video: false
      });
      muteBtn.style.display = '';
      // Add tracks to existing connection
      if (hostPc) {
        localStream.getTracks().forEach(t => hostPc.addTrack(t, localStream));
      }
    } catch (e) {
      setStatus('Microphone access denied — remaining as listener');
    }
  } else if (newRole === 'listener' && localStream) {
    // Remove tracks and stop mic
    if (hostPc) {
      const senders = hostPc.getSenders();
      senders.forEach(s => { if (s.track && s.track.kind === 'audio') hostPc.removeTrack(s); });
    }
    localStream.getTracks().forEach(t => t.stop());
    localStream = null;
    muteBtn.style.display = 'none';
  }
}

function sendSignal(msg) {
  msg.from_callsign = myCallsign;
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(msg));
  }
}

// ── UI ────────────────────────────────────────────────────────────

function updateUI() {
  // Info bar
  const speakerCount = Object.values(knownParticipants).filter(p => p.role === 'speaker').length;
  const totalCount = Object.keys(knownParticipants).length;
  const listenerCount = totalCount - speakerCount;
  infoBar.textContent = speakerCount + ' speaker' + (speakerCount !== 1 ? 's' : '') +
    ', ' + listenerCount + ' listener' + (listenerCount !== 1 ? 's' : '');

  // Participant list
  participantsEl.innerHTML = '';
  for (const [cs, info] of Object.entries(knownParticipants)) {
    const li = document.createElement('li');
    const roleClass = info.role === 'speaker' ? 'role-speaker' : 'role-listener';
    const roleIcon = info.role === 'speaker' ? '&#x1F3A4;' : '&#x1F3A7;';
    const isHost = cs === hostCallsign ? ' (Host)' : '';
    const isMe = cs === myCallsign ? ' (You)' : '';
    li.innerHTML = '<span class="name">' + cs + isHost + isMe + '</span>' +
      '<span class="role-label ' + roleClass + '">' + info.role + '</span>';
    participantsEl.appendChild(li);
  }

  // Connection state
  if (hostPc) {
    const state = hostPc.connectionState || 'new';
    if (state !== 'connected') {
      setStatus('Connecting to host...');
    }
  }
}

function toggleMute() {
  muted = !muted;
  if (localStream) {
    localStream.getAudioTracks().forEach(t => { t.enabled = !muted; });
  }
  muteBtn.textContent = muted ? 'Unmute' : 'Mute';
  muteBtn.classList.toggle('muted', muted);
}

function leaveConference() {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'conference_leave', callsign: myCallsign }));
  }
  cleanup();
  setStatus('Left conference');
}

function cleanup() {
  if (hostPc) { hostPc.close(); hostPc = null; }
  for (const [id, audio] of Object.entries(audioElements)) {
    audio.srcObject = null;
    delete audioElements[id];
  }
  if (localStream) {
    localStream.getTracks().forEach(t => t.stop());
    localStream = null;
  }
  if (ws) { ws.close(); ws = null; }
  callUi.style.display = 'none';
  joinForm.style.display = 'flex';
  document.getElementById('btn-join-listener').disabled = false;
  document.getElementById('btn-join-speaker').disabled = false;
}
</script>
</body>
</html>
