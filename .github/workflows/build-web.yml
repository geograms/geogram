name: Build Web

# Disabled: web build is too buggy with native dependency stripping.
# Keep workflow_dispatch so it can be triggered manually for testing.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Read Flutter version
      id: flutter-version
      run: echo "version=$(cat .flutter-version)" >> $GITHUB_OUTPUT

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ steps.flutter-version.outputs.version }}
        cache: true

    - name: Update version from git
      run: |
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          VERSION="${GITHUB_REF#refs/tags/v}"
        else
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
        fi
        BUILD_NUMBER=$(git rev-list --count HEAD)
        sed -i "s/^version: .*/version: $VERSION+$BUILD_NUMBER/" pubspec.yaml
        echo "Building version $VERSION+$BUILD_NUMBER"

    - name: Remove native-only dependencies
      run: |
        # Remove all FFI/native-only packages that pub resolves but main_web.dart never imports
        sed -i '/^  ffi:/d' pubspec.yaml
        sed -i '/^  whisper_flutter_new:/d' pubspec.yaml
        sed -i '/^  flutter_onnxruntime:/d' pubspec.yaml
        sed -i '/^  tflite_flutter:/d' pubspec.yaml
        sed -i '/^  media_kit:/d' pubspec.yaml
        sed -i '/^  media_kit_video:/d' pubspec.yaml
        sed -i '/^  media_kit_libs_video:/d' pubspec.yaml
        sed -i '/^  webf:/d' pubspec.yaml
        sed -i '/^  pdfx:/d' pubspec.yaml
        sed -i '/^  sqlite3:/d' pubspec.yaml
        sed -i '/^  sqlite3_flutter_libs:/d' pubspec.yaml
        sed -i '/^  dbus:/d' pubspec.yaml
        sed -i '/^  flutter_pty:/d' pubspec.yaml
        sed -i '/^  flutter_blue_plus:/d' pubspec.yaml
        sed -i '/^  ble_peripheral:/d' pubspec.yaml
        sed -i '/^  flutter_zxing:/d' pubspec.yaml
        sed -i '/^  flutter_contacts:/d' pubspec.yaml
        sed -i '/^  window_manager:/d' pubspec.yaml
        sed -i '/^  encrypted_archive:/,/^  [^ ]/{ /^  encrypted_archive:/d; /^    path:/d; }' pubspec.yaml
        # Delete lock file to ensure clean resolution
        rm -f pubspec.lock
        # Clear pub cache to remove cached native packages
        flutter pub cache clean --force

    - name: Install dependencies
      run: flutter pub get

    - name: Build Web Release
      run: flutter build web --release --target=lib/main_web.dart

    - name: Create portable archive
      run: |
        cd build
        tar --sort=name --owner=0 --group=0 --mtime='1970-01-01' -czf ../geogram-web.tar.gz web/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: geogram-web
        path: geogram-web.tar.gz
        retention-days: 30

    - name: Upload to Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: geogram-web.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
