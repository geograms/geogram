name: Build ESP32

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - env: esp32s3_epaper_1in54
            firmware: geogram-ESP32S3-ePaper1in54
          - env: esp32_generic
            firmware: geogram-ESP32-Generic
          - env: esp32c3_mini
            firmware: geogram-ESP32C3-mini
          - env: kv4p
            firmware: geogram-KV4P-HT
          - env: heltec_v2
            firmware: geogram-HeltecV2-LoRa
          - env: heltec_v1
            firmware: geogram-HeltecV1-LoRa
          - env: heltec_v3
            firmware: geogram-HeltecV3-LoRa

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Cache PlatformIO
      uses: actions/cache@v4
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-pio-${{ matrix.env }}-${{ hashFiles('esp32/platformio.ini') }}

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install PlatformIO
      run: pip install platformio

    - name: Build ${{ matrix.firmware }}
      working-directory: esp32
      run: pio run -e ${{ matrix.env }}

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.firmware }}
        path: esp32/firmware/${{ matrix.firmware }}.bin
        retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Download all firmware artifacts
      uses: actions/download-artifact@v4
      with:
        path: firmware

    - name: Collect firmware binaries
      run: |
        mkdir -p release
        find firmware -name '*.bin' -exec cp {} release/ \;
        ls -la release/

    - name: Upload to Release
      uses: softprops/action-gh-release@v1
      with:
        files: release/*.bin
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
