<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <title>{{FOLDER_NAME}} - {{COLLECTION_NAME}}</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="../styles.css">
  {{NOSTR_STYLES}}
</head>
<body>
<div class="container">
  <header class="header">
    <div class="header__inner">
      <div class="header__logo">
        <a href="{{HOME_URL}}" style="text-decoration: none;">
          <div class="logo">{{COLLECTION_NAME}}</div>
        </a>
      </div>
      {{NOSTR_HEADER}}
    </div>
    <nav class="menu">
      <ul class="menu__inner">
        {{MENU_ITEMS}}
      </ul>
    </nav>
  </header>

  <div class="content">
    <div class="shared-directory">
      <div class="breadcrumb">
        <a class="breadcrumb-item" href="../">Shared</a>
        <span class="breadcrumb-item active">{{FOLDER_NAME}}</span>
      </div>

      <div class="file-list-container">
        <div class="file-list">
          {{CONTENT}}
        </div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="footer__inner">
      <div class="copyright">
        <span>published via geogram</span>
      </div>
    </div>
  </footer>
</div>

<script>
{{NOSTR_SCRIPTS}}
</script>
</body>
</html>
