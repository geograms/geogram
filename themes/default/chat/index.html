<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <title>Chat - {{COLLECTION_NAME}}</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
  <header class="header">
    <div class="header__inner">
      <div class="header__logo">
        <a href="{{HOME_URL}}" style="text-decoration: none;">
          <div class="logo">{{COLLECTION_NAME}}</div>
        </a>
      </div>
    </div>
    <nav class="menu">
      <ul class="menu__inner">
        {{MENU_ITEMS}}
      </ul>
    </nav>
  </header>

  <div class="content">
    <div class="chat-layout">
      <!-- Channels sidebar -->
      <aside class="channels-sidebar" id="channels">
        <div class="channels-header">Channels</div>
        {{CHANNELS_LIST}}
      </aside>

      <!-- Messages area -->
      <div class="messages-area">
        <div class="messages-header">
          <span class="room-name">#<span id="current-room">main</span></span>
        </div>
        <div class="messages-list" id="messages">
          {{CONTENT}}
        </div>
        <div class="chat-input-area" id="chat-input-area" style="display:none;">
          <input type="text" id="chat-input" placeholder="Type a message..." autocomplete="off">
          <button id="chat-send">Send</button>
        </div>
        <div class="nostr-login" id="nostr-login" style="display:none;">
          <button id="nostr-connect">Connect with Nostr</button>
        </div>
        <div class="nostr-nickname" id="nostr-nickname" style="display:none;">
          <label for="nickname-input">Choose your callsign:</label>
          <div class="nickname-row">
            <input type="text" id="nickname-input" placeholder="e.g. X1SU86" autocomplete="off" maxlength="20">
            <button id="nickname-ok">Join</button>
          </div>
        </div>
        <div class="nostr-unavailable" id="nostr-unavailable" style="display:none;">
          <span>Install a <a href="https://github.com/nicknsy/nicknsy/blob/main/nostr-extensions.md" target="_blank">Nostr extension</a> to join the chat</span>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="footer__inner">
      <div class="copyright">
        <span>published via geogram</span>
      </div>
    </div>
  </footer>
</div>

<script>
  window.GEOGRAM_DATA = {{DATA_JSON}};
  {{SCRIPTS}}
</script>
</body>
</html>
